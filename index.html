<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexli Store</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
            background-color: #0f0f13;
            color: #ffffff;
        }
        .header {
            padding: 20px;
            text-align: center;
            background: #181820;
            border-bottom: 1px solid #2a2a35;
        }
        .header h1 { margin: 0; font-size: 22px; }
        .container { padding: 20px; }
        .app-card {
            background-color: #1c1c24;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            border: 1px solid #2d2d3a;
        }
        .app-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .app-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 18px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }
        .app-info h2 { margin: 0; font-size: 20px; }
        .app-info p { margin: 4px 0 0; color: #a0a0ab; font-size: 14px; }
        .description {
            font-size: 14px;
            color: #c8c8d0;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(90deg, #38bdf8, #0284c7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Nexli Store</h1>
    </div>
    <div class="container">
        <div class="app-card">
            <div class="app-header">
                <div class="app-icon">Г</div>
                <div class="app-info">
                    <h2>Гром</h2>
                    <p>Версия 1.0 • 28 МБ</p>
                </div>
            </div>
            <div class="description">
            
            </div>
            <a href="#" class="btn">Скачать APK</a>
        </div>
    </div>
</body>
</html>
