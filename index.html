<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        .container { padding: 10px 20px; }
        
        .app-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1C1C1E;
        }
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 22%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }
        .app-info {
            flex-grow: 1;
            margin-left: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .app-title { font-size: 16px; font-weight: 600; margin: 0; }
        .app-subtitle { font-size: 12px; color: #8E8E93; margin: 2px 0 0; }
        
        .action-area {
            width: 76px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .get-btn {
            background-color: #1C1C1E;
            color: #38bdf8;
            border: none;
            border-radius: 16px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .progress-wrapper {
            display: none;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 32px;
            height: 32px;
        }
        .progress-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#38bdf8 0%, #2C2C2E 0%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-inner {
            width: 26px;
            height: 26px;
            background-color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-text {
            font-size: 8px;
            font-weight: bold;
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Карточка вашего мессенджера -->
        <div class="app-row">
            <div class="app-icon">Г</div>
            <div class="app-info">
                <h2 class="app-title">Гром</h2>
                <p class="app-subtitle">Мессенджер будущего</p>
            </div>
            <div class="action-area">
                <button class="get-btn" id="getBtn" onclick="startDownload()">ЗАГР.</button>
                <div class="progress-wrapper" id="progressWrapper">
                    <div class="progress-circle" id="progressCircle">
                        <div class="progress-inner">
                            <span class="progress-text" id="progressText">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Пример второго приложения для вида каталога -->
        <div class="app-row">
            <div class="app-icon" style="background: linear-gradient(135deg, #8E8E93, #48484A);">N</div>
            <div class="app-info">
                <h2 class="app-title">Nexli Cloud</h2>
                <p class="app-subtitle">Файловое хранилище</p>
            </div>
            <div class="action-area">
                <button class="get-btn">ЗАГР.</button>
            </div>
        </div>
        
    </div>

    <script>
        function startDownload() {
            const btn = document.getElementById('getBtn');
            const wrapper = document.getElementById('progressWrapper');
            const circle = document.getElementById('progressCircle');
            const text = document.getElementById('progressText');
            
            btn.style.display = 'none';
            wrapper.style.display = 'flex';
            
            let percent = 0;
            const interval = setInterval(() => {
                percent += 2;
                circle.style.background = `conic-gradient(#38bdf8 ${percent}%, #2C2C2E ${percent}%)`;
                text.innerText = percent + '%';
                
                if (percent >= 100) {
                    clearInterval(interval);
                    wrapper.style.display = 'none';
                    btn.style.display = 'block';
                    btn.innerText = 'ОТКР.';
                    btn.onclick = null;
                }
            }, 50);
        }
    </script>
</body>
</html>
